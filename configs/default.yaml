project:
  name: context_based_anomalous_flow_detector
  experiment_name: mini_bert_unsw_nb15

datasets:
  unsw_nb15:
    raw_input: data/unsw_nb15/raw/NF-UNSW-NB15-v3.csv
    processed_data_dir: data/unsw_nb15/processed
    group_cols:
      - ipsrc
    time_col: starttime
    seq_len: 34

model:
  name: mini_bert
  num_cont_features: 13
  proto_vocab_size: 257
  port_vocab_size: 65537
  d_model: 128
  n_heads: 4
  num_layers: 4
  dropout: 0.1

training:
  batch_size: 64
  learning_rate: 0.0001
  num_epochs: 20
  weight_decay: 0.00001
  device: auto

outputs:
  models_dir: models
  reports_dir: reports