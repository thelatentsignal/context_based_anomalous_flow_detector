[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "context_based_anomalous_flow_detector"
version = "0.0.1"
description = "Test if batches of anomalouse flows can be detected using a Bert-style approach."
authors = [
  { name = "Your name (or your organization/company/team)" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.12"


[tool.ruff]
line-length = 99
src = ["context_based_anomalous_flow_detector"]
include = ["pyproject.toml", "context_based_anomalous_flow_detector/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["context_based_anomalous_flow_detector"]
force-sort-within-sections = true

