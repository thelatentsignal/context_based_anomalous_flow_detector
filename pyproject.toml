[build-system]
requires = ["flit_core >=3.12,<4"] 
build-backend = "flit_core.buildapi"

[project]
name = "context_based_anomalous_flow_detector"
version = "0.0.1"
description = "Test if batches of anomalous flows can be detected using a Bert-style approach."
authors = [
  { name = "Markelic" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12"
dependencies = [
 "pyyaml",
 "torch",
 "pandas",
 "numpy",
 "scikit-learn",
 "tqdm",
 "typer",
 "dvc",
 "sf-hamilton",
 "matplotlib",
 "loguru",
 "pyarrow",
]

[project.optional-dependencies]
dev = [
 "pytest",
 "ruff",
]


[tool.ruff]
line-length = 99
src = ["context_based_anomalous_flow_detector"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["context_based_anomalous_flow_detector"]
force-sort-within-sections = true

